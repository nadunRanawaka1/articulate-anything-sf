# Example configuration for processing multiple objects in one scene
defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: custom

# ===== Main cfg =====
root_dir: ../simfoundry_results
scene_name: <FILL>  # Top-level directory name
seed: 0
visualize: false
debug: false
gcloud_project: ${oc.env:GCLOUD_PROJECT} # Example: example-real2sim_project-12345
vlm_backend: vertex  # VLM calls run on Vertex AI Gemini using gcloud_project
gcloud_location: global
rerun_all: false
verbose: true

# Copy articulation tree from first object to all others (skips VLM for similar objects)
# Use this when processing multiple similar objects (e.g., same type of trash can)
copy_articulation_from_first: false

# ===== Multi-object configuration =====
# List of objects to process (Comment out for single-object mode)
objects:
  - <FILL>

# ===== Shared step configurations =====
# These apply to ALL objects (can be overridden per-object if needed)

s1_render:
  rerun: false
  convert_to_partnet: true
  out_dirname: s1_render
  camera_mode: icosahedron
  num_views: 12
  renderer: pyrender   # pyrender (default, light) | blender (needs the blender binary; better textures)
  resolution:
  - 1920
  - 1080
s2_generate_articulation_tree:
  rerun: false
  out_dirname: s2_generate_articulation_tree
  model_name: gemini-2.5-flash
s3_segment_mesh:
  rerun: false
  segment_method: hunyuan
  out_dirname: s3_segment_mesh
  camera_mode: icosahedron
  num_views: 12
  renderer: pyrender
  resolution:
  - 1920
  - 1080
  max_segments: 15
  make_watertight: false
  watertight_grid_res: 128
  watertight_epsilon: 0.005
  repair_mesh: false
  clean_mesh: false
  explode: true
  explosion_factor: 0.4
  num_clusters: 10

  point_num: 500000
  threshold: 0.85
  prompt_num: 400
  smooth_iterations: 3  # Iterations to smooth jagged segment boundaries (0 = disabled)
  remove_disconnected_regions: false  # Remove small isolated face clusters and reassign to neighbors
  min_region_ratio: 0.1  # Regions < 10% of largest region in segment get reassigned
  min_region_faces: 50   # But always keep regions with >= 50 faces
  use_solid_color: false  # Remove textures and use solid color for segmentation (geometry-only)
  solid_color: [128, 128, 128]  # RGB color to use when use_solid_color is true
  segment_model_path: null
  samesh_config_path: samesh/simfoundry_basic_no_split.yaml

s4_merge_mesh_parts:
  rerun: false
  out_dirname: s4_merge_mesh_parts
  model_name: gemini-3-pro-preview
  interactive_correction: true
s5_articulate:
  rerun: true
  out_dirname: s5_articulate
  rotate_meshes: false
  auto_raise_offset: true
  auto_raise_offset_clearance: 0.5
  auto_camera: true              # Auto-compute camera positions based on object size
  auto_camera_padding: 2.5       # Distance multiplier (larger = camera further away)
  auto_camera_min_distance: 0.5  # Minimum camera distance in world units
  articulation_cfg_path: conf/config_simfoundry.yaml
hydra:
  job:
    chdir: true
  run:
    dir: .
  output_subdir: null
