defaults:
- _self_
- override hydra/hydra_logging: disabled
- override hydra/job_logging: custom
root_dir: path/to/Data/picnic_basket/s8b_articulate_objects
scene_name: picnic_basket
seed: 0
visualize: false
debug: false
gcloud_project: ${oc.env:GCLOUD_PROJECT}
gcloud_location: global
rerun_all: false
verbose: true
objects:
- name: wicker_picnic_basket
  mesh_path: path/to/Data/picnic_basket/s8_pose/canonical_mesh/iter_4.glb
  image_path: path/to/Data/picnic_basket/s6_upsample/upsampled/iter_4.png
s1_render:
  rerun: false
  convert_to_partnet: true
  out_dirname: s1_render
  camera_mode: icosahedron
  num_views: 12
  renderer: pyrender   # pyrender (default, light) | blender (needs the blender binary; better textures)
  resolution:
  - 1920
  - 1080
s2_generate_articulation_tree:
  rerun: false
  out_dirname: s2_generate_articulation_tree
  model_name: gemini-2.5-flash
s3_segment_mesh:
  rerun: false
  segment_method: samesh
  out_dirname: s3_segment_mesh
  camera_mode: icosahedron
  num_views: 12
  renderer: pyrender
  resolution:
  - 1920
  - 1080
  max_segments: 15
  make_watertight: false
  watertight_grid_res: 128
  watertight_epsilon: 0.005
  repair_mesh: false
  explode: true
  explosion_factor: 0.4
  num_clusters: 10
  point_num: 50000
  prompt_num: 800
  segment_model_path: null
  samesh_config_path: samesh/simfoundry_basic_no_split.yaml
s4_merge_mesh_parts:
  rerun: false
  out_dirname: s4_merge_mesh_parts
  model_name: gemini-3.1-pro-preview
  interactive_correction: true
s5_articulate:
  rerun: true
  out_dirname: s5_articulate
  rotate_meshes: false
  auto_raise_offset: true
  auto_raise_offset_clearance: 0.5
  articulation_cfg_path: conf/config_simfoundry.yaml
hydra:
  job:
    chdir: true
  run:
    dir: .
  output_subdir: null
