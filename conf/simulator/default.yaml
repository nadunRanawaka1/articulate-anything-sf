name: sapien # (sapien)
# script_path: "articulate_anything/physics/sapien_simulate.py"
script_path: "articulate_anything/physics/sapien_simulate_simfoundry.py"
conda_env: "articulate-anything"
camera_params:
  width: 1280
  height: 720
  views:
    frontview:
      cam_pos: [3, 1.5, 2]
      look_at: [0, 0, 0.8]
    left_45:
      cam_pos: [2.5, -2.5, 2]
      look_at: [0, 0, 0.8]
    right_45:
      cam_pos: [2.5, 2.5, 2]
      look_at: [0, 0, 0.8]
    backview:
      cam_pos: [-3, -1.5, 2]
      look_at: [0, 0, 0.8]
    below_front:
      cam_pos: [3.5, 0, 0.01]
      look_at: [0, 0, 0.8]
    below_back:
      cam_pos: [-3.5, 0, 0.01]
      look_at: [0, 0, 0.8]
    angle45:
      cam_pos: [2.5, 2.5, 2.5]
      look_at: [0, 0, 0.8]
floor_texture: plain # (plain, checkerboard)
use_segmentation: false
object_white: true
ray_tracing: false
headless: true
flip_video: false
show_axes: true  # Show XYZ coordinate axes overlay on renders (helps VLM understand orientation)
axes_origin: [0, 0, 0]  # Origin point for coordinate axes (auto-set by articulate_simfoundry if auto_camera is enabled)
simulation_params:
  stationary_or_move: stationary # (stationary, move)
  num_steps: 100  # Number of frames (24 fps, so 100 = ~4 seconds)
  joint_name: "all_simultaneous" # (all, all_simultaneous, {or specific joint_id})
  joint_move_dir: "auto" # (auto, move_up, move_down)
output:
  dir: null
  seg_json: null
urdf:
  file: null
  raise_distance_file: null
  raise_distance_offset: 0
  rotation_pose:
    rx: 0
    ry: 0
    rz: 0
engine:
  timestep: 0.01
lighting:
  ambient: [0.5, 0.5, 0.5]
  directional:
    direction: [0, 1, -1]
    color: [0.5, 0.5, 0.5]