project_root: "path/to/Projects/articulate-anything"
# prompt: "path/to/Projects/articulate-anything/custom_objects/bamboo_cabinet/backup/robot_frontview.png"
prompt: "path/to/Projects/articulate-anything/results/default_cabinet/link_placement/iter_1/seed_0/robot_frontview.png"
additional_prompt: null
modality: "image"
out_dir: "results/default_cabinet"
# dataset_dir: "datasets/partnet-mobility-v0/dataset"
dataset_dir: "datasets/partnet-mobility-v0-processed/partnet-mobility-v0/dataset"
api_key: null
gcloud_project: ${oc.env:GCLOUD_PROJECT,null}
# "global" is the only endpoint that serves every model used here: regional
# endpoints (e.g. us-west1) do not serve gemini-3.1-pro-preview and fail with
# 404s mid-run.
gcloud_location: global
# Where VLM calls run:
#   vertex    -> Vertex AI, authenticated with gcloud ADC + gcloud_project.
#                Serves both Gemini and Claude. (default)
#   anthropic -> the direct Anthropic API (Claude only); needs ANTHROPIC_API_KEY.
vlm_backend: vertex
# Vertex region for Claude only. Claude is not served in every Gemini region
# (e.g. us-west1), so it gets its own knob; "global" is the safe choice.
# Ignored when model_name is a Gemini model.
claude_location: global
n_retries: 3 # number of retries for the LLM agent
parallel: 4
max_load_per_gpu: 10
obj_ids: null
gpu_id: 0
cam_view: angle45
rotate_urdf: true
# Model driving the joint actor + joint critic (step 5).
# Gemini: gemini-2.5-flash, gemini-2.5-pro, gemini-3.1-pro-preview
# Claude: claude-opus-5, claude-opus-4-8, claude-sonnet-5, claude-haiku-4-5
# Claude takes text/images/PDF but NOT video: with a Claude model the
# `simfoundry_video` critic automatically samples frames from the prediction
# video instead of uploading the mp4.
# model_name: gemini-2.5-pro
model_name: gemini-3.1-pro-preview
# model_name: gemini-2.5-flash
# model_name: claude-opus-5
link_placement_path: null
gen_config:
  overwrite: false # whether to overwrite the VLM output
render_part_views: false

actor_critic:
  actor_only: false
  start_seed: 0
  num_seeds: 2
  start_iter: 0
  max_iter: 5
  conservative: true
  cutoff: 8

defaults:
  - video_encoding: default
  - category_selector: default
  - obj_selector: default
  - simulator: default
  - link_actor: default
  - link_critic: default
  - partnet_mesh_retrieval: default
  - cotracker: default
  - in_context: default
  - joint_actor: default
  - joint_critic: default

# Override specific fields from defaults
link_critic:
  type: simfoundry
joint_actor:
  mode: image
  targetted_affordance: false
  use_cotracker: true
joint_critic:
  mode: image
  use_cotracker: true
  type: simfoundry_video
simulator:
  conda_env: "articulate-anything"
  urdf:
    raise_distance_offset: 0.0  # Will be auto-computed if auto_raise_offset=true
    # rotation_pose:
    #     rx: 1.57  # 90° around X
    #     ry: 0
    #     rz: 1.57  # 90° around Z 